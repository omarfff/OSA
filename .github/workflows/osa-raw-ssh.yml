name: OSA Raw SSH

on:
  push:
    branches: [main]
    paths:
      - 'ops/raw-ssh-trigger.txt'

permissions:
  contents: read
  id-token: write

jobs:
  raw-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Execute raw SSH job
        shell: bash
        env:
          BROKER_URL: https://jpnlmpqqtiwisxcsjwbm.supabase.co/functions/v1/osa-github-ssh-broker
        run: |
          set -euo pipefail
          umask 077

          JOB_ID="$(curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/ops/raw-ssh-trigger.txt" | tr -d '\r\n[:space:]')"
          if ! [[ "$JOB_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then echo "invalid job id" >&2; exit 2; fi

          ssh-keygen -q -t ed25519 -N '' -C "osa-gh-${GITHUB_RUN_ID}" -f /tmp/osa_key
          OIDC_TOKEN="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=osa-raw-ssh" | jq -r '.value')"
          test -n "$OIDC_TOKEN"
          CLAIM_PAYLOAD="$(jq -n --arg action claim --arg job_id "$JOB_ID" --arg public_key "$(cat /tmp/osa_key.pub)" '{action:$action,job_id:$job_id,public_key:$public_key}')"
          CLAIM_FILE="$(mktemp)"
          CLAIM_HTTP="$(curl -sS -o "$CLAIM_FILE" -w '%{http_code}' -H "Authorization: Bearer ${OIDC_TOKEN}" -H 'Content-Type: application/json' --data "$CLAIM_PAYLOAD" "$BROKER_URL" || true)"
          if [ "$CLAIM_HTTP" = "409" ]; then
            CLAIM_ERROR="$(jq -r '.error // empty' "$CLAIM_FILE" 2>/dev/null || true)"
            CLAIM_STATE="$(jq -r '.state // empty' "$CLAIM_FILE" 2>/dev/null || true)"
            if [ "$CLAIM_ERROR" = "job_not_pending" ] && [ "$CLAIM_STATE" = "succeeded" ]; then
              echo "RAW SSH job ${JOB_ID} already succeeded; idempotent no-op."
              exit 0
            fi
            echo "RAW SSH claim conflict HTTP 409 error=${CLAIM_ERROR:-unknown} state=${CLAIM_STATE:-unknown}" >&2
            exit 24
          fi
          if ! [[ "$CLAIM_HTTP" =~ ^2[0-9][0-9]$ ]]; then
            echo "RAW SSH claim failed HTTP ${CLAIM_HTTP}" >&2
            exit 22
          fi
          CLAIM="$(cat "$CLAIM_FILE")"
          test "$(jq -r '.ok' <<<"$CLAIM")" = "true"

          HOST="$(jq -r '.host' <<<"$CLAIM")"
          PORT="$(jq -r '.port' <<<"$CLAIM")"
          PRINCIPAL="$(jq -r '.principal' <<<"$CLAIM")"
          EXPECTED_FP="$(jq -r '.host_ed25519_fingerprint' <<<"$CLAIM")"
          CERT="$(jq -r '.certificate' <<<"$CLAIM")"
          CMD_B64="$(jq -r '.command_b64' <<<"$CLAIM")"
          REPORT_TOKEN="$(jq -r '.report_token' <<<"$CLAIM")"
          test ${#REPORT_TOKEN} -eq 64
          printf '%s\n' "$CERT" > /tmp/osa_key-cert.pub
          chmod 600 /tmp/osa_key /tmp/osa_key-cert.pub
          printf '%s' "$CMD_B64" | base64 -d > /tmp/osa_command.sh
          chmod 600 /tmp/osa_command.sh

          # Fail closed for the protected Clawlancer credential. The only allowed
          # Clawlancer VPS execution path is the secret-safe helper with one of its
          # explicitly approved actions. This prevents accidental credential reads
          # from ever reaching GitHub logs.
          if grep -Fq '/opt/osa/secrets/clawlancer_osa_revenue_cdp.json' /tmp/osa_command.sh; then
            echo "protected Clawlancer secret path is forbidden in raw SSH commands" >&2
            exit 25
          fi
          if grep -Fq '/opt/osa/workspace/clawlancer_client.py' /tmp/osa_command.sh; then
            NORMALIZED="$(tr -d '\r' < /tmp/osa_command.sh | sed -e 's/[[:space:]]*$//' -e '/^[[:space:]]*$/d')"
            if ! [[ "$NORMALIZED" =~ ^(/usr/bin/python3|python3)[[:space:]]+/opt/osa/workspace/clawlancer_client\.py[[:space:]]+(balance|status|claim)$ ]]; then
              echo "unapproved Clawlancer helper invocation" >&2
              exit 26
            fi
          fi

          ssh-keyscan -T 10 -p "$PORT" -t ed25519 "$HOST" > /tmp/known_hosts 2>/dev/null
          ACTUAL_FP="$(ssh-keygen -lf /tmp/known_hosts | awk 'NR==1{print $2}')"
          if [ "$ACTUAL_FP" != "$EXPECTED_FP" ]; then echo "host key fingerprint mismatch" >&2; exit 3; fi

          set +e
          ssh -p "$PORT" -i /tmp/osa_key -o CertificateFile=/tmp/osa_key-cert.pub -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/tmp/known_hosts -o ConnectTimeout=15 "${PRINCIPAL}@${HOST}" 'bash -s' < /tmp/osa_command.sh > /tmp/osa_stdout 2> /tmp/osa_stderr
          RC=$?
          set -e

          REPORT_PAYLOAD="$(jq -n --arg action report --arg job_id "$JOB_ID" --arg report_token "$REPORT_TOKEN" --argjson exit_code "$RC" --rawfile stdout /tmp/osa_stdout --rawfile stderr /tmp/osa_stderr '{action:$action,job_id:$job_id,report_token:$report_token,exit_code:$exit_code,stdout:$stdout,stderr:$stderr}')"
          REPORT_OK=0
          for ATTEMPT in 1 2 3; do
            REPORT_OIDC_TOKEN="$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=osa-raw-ssh" | jq -r '.value')"
            REPORT_FILE="$(mktemp)"
            REPORT_HTTP="$(curl -sS -o "$REPORT_FILE" -w '%{http_code}' -H "Authorization: Bearer ${REPORT_OIDC_TOKEN}" -H 'Content-Type: application/json' --data "$REPORT_PAYLOAD" "$BROKER_URL" || true)"
            if [[ "$REPORT_HTTP" =~ ^2[0-9][0-9]$ ]]; then REPORT_OK=1; break; fi
            echo "RAW SSH report attempt ${ATTEMPT} failed HTTP ${REPORT_HTTP}" >&2
            sleep "$ATTEMPT"
          done
          if [ "$REPORT_OK" -ne 1 ]; then exit 23; fi

          cat /tmp/osa_stdout
          cat /tmp/osa_stderr >&2
          if [ "$RC" -ne 0 ]; then
            echo "::error::Remote OSA command exited ${RC}; failure is recorded in the OSA control plane."
            exit "$RC"
          fi

          exit 0
