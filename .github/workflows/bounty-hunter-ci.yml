name: Bounty Hunter CI

on:
  push:
    branches: [main]
    paths:
      - 'ops/bounty-hunter/**'
      - 'ops/systemd/osa-bounty-hunter.service'
      - 'ops/install-bounty-hunter.sh'
      - '.github/workflows/bounty-hunter-ci.yml'
  pull_request:
    paths:
      - 'ops/bounty-hunter/**'
      - 'ops/systemd/osa-bounty-hunter.service'
      - 'ops/install-bounty-hunter.sh'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ops/bounty-hunter/requirements.txt
      - name: Compile
        run: python -m py_compile ops/bounty-hunter/bounty_hunter.py
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r ops/bounty-hunter/requirements.txt
          python -m pip check
      - name: Unit tests
        working-directory: ops/bounty-hunter
        run: python -m pytest -q test_bounty_hunter.py
      - name: Check repository cleanliness
        run: |
          test -z "$(git status --porcelain)"
          test ! -d ops/bounty-hunter/__pycache__ || rm -rf ops/bounty-hunter/__pycache__
