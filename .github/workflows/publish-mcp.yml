name: Publish OSA Procurement Guard to MCP Registry

on:
  push:
    branches: [main]
    paths:
      - server.json
      - .github/workflows/publish-mcp.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install pinned mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_LINUX_AMD64_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 "$url" -o /tmp/mcp-publisher.tar.gz
          echo "${MCP_PUBLISHER_LINUX_AMD64_SHA256}  /tmp/mcp-publisher.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file /tmp/mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Validate manifest
        run: ./mcp-publisher validate server.json

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish to official MCP Registry
        run: ./mcp-publisher publish server.json
