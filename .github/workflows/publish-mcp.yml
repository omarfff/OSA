name: Publish OSA Procurement Guard to MCP Registry

on:
  push:
    branches: [main]
    paths:
      - server.json
      - .github/workflows/publish-mcp.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Install pinned mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_LINUX_AMD64_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 "$url" -o /tmp/mcp-publisher.tar.gz
          echo "${MCP_PUBLISHER_LINUX_AMD64_SHA256}  /tmp/mcp-publisher.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file /tmp/mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --help >/dev/null

      - name: Validate manifest
        run: ./mcp-publisher validate server.json

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish to official MCP Registry
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp)"
          set +e
          ./mcp-publisher publish server.json >"$out" 2>&1
          rc=$?
          set -e
          cat "$out"
          if [ "$rc" -eq 0 ]; then exit 0; fi
          if grep -Fq 'invalid version: cannot publish duplicate version' "$out"; then
            if [ "$GITHUB_EVENT_NAME" = "push" ] && git rev-parse "${GITHUB_SHA}^" >/dev/null 2>&1 && git diff --name-only "${GITHUB_SHA}^" "$GITHUB_SHA" -- | grep -Fxq 'server.json'; then
              echo '::error::server.json changed but its version is already published; bump server.json version.'
              exit "$rc"
            fi
            echo '::notice::This exact MCP version is already published; treating an unchanged-manifest rerun as idempotent success.'
            exit 0
          fi
          exit "$rc"
